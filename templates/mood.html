<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mood Based Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-transparent text-dark">

    <div class="container d-flex flex-column align-items-center justify-content-center mt-5">
        <div class="glass-box text-center p-5" style="max-width: 600px; width: 100%;">
            <h2 class="mb-4 text-dark"> Mood Based Food Recommendation</h2>

            <form method="post" class="mb-4">
                <select name="mood" class="form-select mb-4" required>
                    {% for mood in moods %}
                    <option value="{{ mood }}">{{ mood }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="btn btn-primary w-100">Get Food Recommendation</button>
            </form>

            {% if result %}
            <div class="alert alert-success mt-4 mb-2 text-dark">
                <strong>Recommended Food:</strong> {{ result }}
            </div>
            {% endif %}

            <!-- Back Button -->
            <div class="mt-4">
                <a href="/home" class="btn btn-outline-light">← Back to Home</a>
            </div>
        </div>
    </div>

</body>

</html>
