<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Food Recommendation System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Flask Static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-transparent text-white">

    <div class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card p-4 shadow login-card">
                    <h3 class="text-center mb-4 fw-bold">Login</h3>

                    <form method="post">
                        <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>

                        <input class="form-control mb-3" type="password" name="password" placeholder="Password"
                            required>

                        <button class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>

                    <div class="d-flex justify-content-between mt-3 px-1">
                        <a href="/forgot-password" class="small">Forgot Password?</a>
                        <a href="/signup" class="small">Create Account</a>
                    </div>
                </div>

            </div>
    </div>
    </div>

</body>

</html>
